<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  :root {
    --navy: #1F4E79;
    --navy-2: #163a5c;
    --ink: #1a2332;
    --muted: #5c6379;
    --line: #e6eaf0;
    --green: #137333;
    --green-bg: #e6f4ea;
    --amber: #b06000;
    --amber-bg: #fff4e5;
    --red: #c5221f;
    --red-bg: #fce8e6;
    --zebra: #f7f9fc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Segoe UI", Calibri, system-ui, sans-serif;
    color: var(--ink); background: transparent;
  }
  .ce-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 0 0 14px; }
  .ce-title { font-size: 1.35rem; font-weight: 700; color: var(--navy); margin: 0; }
  .ce-sub { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin: 10px 6px 0 0; }
  .chip.regla { background: var(--green-bg); color: var(--green); }
  .chip.sugerido { background: var(--amber-bg); color: var(--amber); }
  .chip.a_clasificar { background: var(--red-bg); color: var(--red); }
  .btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 650; cursor: pointer; font-size: 14px; }
  .btn.primary { background: var(--navy); color: #fff; min-width: 128px; }
  .btn.primary:hover { background: var(--navy-2); }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  .wrap { max-height: 640px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  table { width: 100%; border-collapse: collapse; min-width: 1100px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--navy); color: #fff; font-size: 12px; font-weight: 600;
    text-align: left; padding: 10px; white-space: nowrap;
  }
  thead th.num { text-align: right; }
  thead th:nth-child(2) { min-width: 240px; }
  thead th:nth-child(5), thead th:nth-child(6) { min-width: 260px; }
  tbody td { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody td:nth-child(2) { min-width: 240px; white-space: normal; }
  tbody td:nth-child(5), tbody td:nth-child(6) { min-width: 260px; }
  tbody tr:nth-child(even) { background: var(--zebra); }
  tbody tr.pend { background: #fff6f5; }
  tbody tr.elim td { opacity: .45; text-decoration: line-through; }
  tbody tr.elim select, tbody tr.elim input { pointer-events: none; }
  .btn-del { border: 0; background: transparent; cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 6px; }
  .btn-del:hover { background: var(--zebra); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .deb { color: #9b1c1c; }
  .cred { color: #137333; }
  select, input[type="text"] {
    width: 100%; min-width: 240px; border: 1px solid #d3dae4; border-radius: 6px;
    padding: 5px 7px; font-size: 12.5px; background: #fff; font-family: inherit;
  }
  select[data-k="clasif"] { min-width: 280px; }
  .tag { font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 999px; }
  .tag.regla { background: var(--green-bg); color: var(--green); }
  .tag.sugerido { background: var(--amber-bg); color: var(--amber); }
  .tag.a_clasificar { background: var(--red-bg); color: var(--red); }
  .foot { margin-top: 12px; }
</style>
</head>
<body>
  <div class="ce-top">
    <div>
      <p class="ce-title" id="titulo">Extracto</p>
      <p class="ce-sub" id="sub"></p>
      <span class="chip regla" id="n-regla">0 con regla</span>
      <span class="chip sugerido" id="n-sug">0 sugeridas</span>
      <span class="chip a_clasificar" id="n-pend">0 a clasificar</span>
    </div>
    <button class="btn primary" type="button" id="btn-sig">Siguiente</button>
  </div>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Descripción</th>
          <th class="num">Débito</th>
          <th class="num">Crédito</th>
          <th>Clasificación</th>
          <th>Cuenta Tango</th>
          <th>Origen</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="grid"></tbody>
    </table>
  </div>
  <div class="foot">
    <button class="btn ghost" type="button" id="btn-vol">Volver a subir</button>
  </div>
<script>
function send(type, data) {
  const msg = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
  window.parent.postMessage(msg, "*");
}
function setHeight() {
  const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, 420);
  send("streamlit:setFrameHeight", { height: h + 8 });
}
function sendValue(value) {
  send("streamlit:setComponentValue", { value: value, dataType: "json" });
}

let FILAS = [];
let CUENTAS = [];
let CUENTAS_SIG = "";
let CLASIFS = [];
let PINTADO = false;
let FILAS_SIG = "";
let GRID_ID = "";
const OTRO = "__otro__";

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function money(n) {
  const x = Number(n || 0);
  if (!x) return "";
  return x.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function parseLista(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  if (typeof raw === "string") {
    try { return JSON.parse(raw); } catch (e) { return []; }
  }
  return [];
}
function parseCuentas(raw) { return parseLista(raw); }
function normClasif(s) {
  return String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
}
function claveRepetida(m) {
  let t = String(m.desc || "").toLowerCase().trim();
  t = t.replace(/\s+/g, " ").replace(/\b\d{5,}\b/g, "").trim();
  return t;
}
function claveSimilar(m) {
  let t = String(m.desc || "").toLowerCase().trim();
  t = t.replace(/\s+/g, " ");
  t = t.replace(/\b\d{4,}\b/g, "");
  t = t.replace(/-?\s*\d+\s*\/\s*\d+/g, "");
  t = t.replace(/\s+/g, " ").trim();
  return t;
}
function clasifUsaCuenta(n) {
  return n && n !== "sin clasificar" && n.indexOf("identificar") < 0;
}
function cuentaDeClasif(nombre) {
  const n = normClasif(nombre);
  if (!clasifUsaCuenta(n)) return "";
  const hit = CLASIFS.find((c) => normClasif(c.nombre) === n);
  const cod = hit ? String(hit.codigo || "") : "";
  if (cod && cod !== "99999") return cod;
  for (let k = 0; k < FILAS.length; k++) {
    const m = FILAS[k];
    if (normClasif(m.clasif) === n && m.codigo && m.codigo !== "99999") return String(m.codigo);
  }
  return "";
}
function upsertClasif(nombre, codigo) {
  const nom = String(nombre || "").trim();
  if (!nom) return;
  const i = CLASIFS.findIndex((c) => normClasif(c.nombre) === normClasif(nom));
  const cod = String(codigo || "");
  if (i >= 0) {
    if (cod && cod !== "99999") CLASIFS[i].codigo = cod;
    return;
  }
  CLASIFS.push({ nombre: nom, codigo: (cod && cod !== "99999") ? cod : "" });
}
function pintarFilaCuenta(i, codigo, origen) {
  FILAS[i].codigo = codigo;
  FILAS[i].origen = origen;
  const sel = document.querySelector('select[data-k="codigo"][data-i="' + i + '"]');
  if (sel && sel.value !== String(codigo)) sel.value = String(codigo);
  const tr = sel ? sel.closest("tr") : null;
  if (tr) {
    tr.classList.toggle("pend", origen === "a_clasificar");
    const tag = tr.querySelector(".tag");
    if (tag) {
      tag.className = "tag " + origen;
      tag.textContent = labelOrigen(origen);
    }
  }
}
function aplicarCuentaAClasif(nombre, codigo) {
  const nom = String(nombre || "").trim();
  const cod = String(codigo || "");
  if (!clasifUsaCuenta(normClasif(nom)) || !cod || cod === "99999") return;
  upsertClasif(nom, cod);
  const n = normClasif(nom);
  const origen = cod === "99999" ? "a_clasificar" : "sugerido";
  FILAS.forEach((m, i) => {
    if (normClasif(m.clasif) !== n) return;
    if (m.origen === "manual") return;
    const orig = (m.origen === "regla" && cod !== "99999") ? "regla" : origen;
    pintarFilaCuenta(i, cod, orig);
  });
  chips();
  persistLocal();
}
function codigoDesdeTexto(texto) {
  let s = String(texto || "").trim();
  if (!s) return "99999";
  const dash = s.indexOf("—");
  if (dash >= 0) return s.slice(0, dash).trim() || "99999";
  if (/^\d+$/.test(s)) return s;
  const hit = CUENTAS.find((c) => String(c.label || "").toLowerCase() === s.toLowerCase());
  if (hit) return String(hit.codigo || "99999");
  return "99999";
}
function textoDeCodigo(cod, opciones) {
  const lista = (opciones && opciones.length) ? opciones : CUENTAS;
  const c = String(cod || "");
  const hit = lista.find((x) => String(x.codigo || "") === c);
  if (hit) return hit.label || (c ? c + " — " : "");
  return (c && c !== "99999") ? c : "";
}
function asegurarDatalistCuentas() {
  let dl = document.getElementById("dl-cuentas");
  if (!dl) {
    dl = document.createElement("datalist");
    dl.id = "dl-cuentas";
    document.body.appendChild(dl);
  }
  dl.innerHTML = CUENTAS.map((c) => {
    const lab = c.label || (String(c.codigo || "") + " — ");
    return `<option value="${esc(lab)}"></option>`;
  }).join("");
}
function optsHtml(sel, opciones) {
  const lista = (opciones && opciones.length) ? opciones : CUENTAS;
  return lista.map((c) => {
    const cod = String(c.codigo || "");
    const lab = c.label || (cod + " — ");
    return `<option value="${esc(cod)}" ${cod === String(sel) ? "selected" : ""}>${esc(lab)}</option>`;
  }).join("");
}
function optsClasif(sel) {
  const seen = {};
  let html = "";
  CLASIFS.forEach((c) => {
    const n = String(c.nombre || "").trim();
    const k = normClasif(n);
    if (!n || seen[k]) return;
    seen[k] = true;
    html += `<option value="${esc(n)}" ${normClasif(n) === normClasif(sel) ? "selected" : ""}>${esc(n)}</option>`;
  });
  if (sel && !seen[normClasif(sel)]) {
    html = `<option value="${esc(sel)}" selected>${esc(sel)}</option>` + html;
  }
  html += `<option value="${OTRO}">Otro…</option>`;
  return html;
}
function labelOrigen(o) {
  if (o === "regla") return "Regla";
  if (o === "sugerido") return "Sugerido";
  if (o === "manual") return "Manual";
  return "A clasificar";
}
function snapshot() {
  return {
    filas: sinRecap(FILAS).map((m) => ({
      i: m.i,
      clasif: m.clasif,
      codigo: m.codigo,
      origen: m.origen,
      eliminado: !!m._eliminado,
    })),
    clasifs: CLASIFS.map((c) => ({ nombre: c.nombre, codigo: c.codigo || "" })),
  };
}
function esRecap(desc) {
  let n = String(desc || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  n = n.replace(/\s+/g, " ").trim();
  if (!n) return false;
  const marcas = [
    "consolidado de retencion", "consolidado importe", "consolidado de impuestos",
    "total retencion", "total mensual", "total impuesto",
    "credito computable como pago a cuenta", "los depositos en pesos",
    "garantia de hasta", "ley 24.485", "detalle impositivo",
    "los totales mensuales", "credito fiscal discriminado",
  ];
  if (marcas.some((k) => n.indexOf(k) >= 0)) return true;
  const ley = n.indexOf("25413") >= 0 || n.indexOf("25.413") >= 0 || n.indexOf("25 413") >= 0;
  return ley && n.indexOf("sobre credito") >= 0 && n.indexOf("sobre debito") >= 0;
}
function sinRecap(filas) {
  return (filas || []).filter((m) => !esRecap(m.desc));
}
function firmaFilas(filas) {
  return (filas || []).map((m) => [m.i, m.fecha, m.desc, m.deb, m.cred].join("\t")).join("\n");
}
function persistLocal() {
  if (!GRID_ID) return;
  try { sessionStorage.setItem("ce_extracto_" + GRID_ID, JSON.stringify(snapshot().filas)); } catch (e) {}
}
function restoreLocal(base) {
  if (!GRID_ID) return base;
  try {
    const raw = sessionStorage.getItem("ce_extracto_" + GRID_ID);
    if (!raw) return base;
    const saved = JSON.parse(raw);
    if (!Array.isArray(saved) || saved.length !== base.length) return base;
    const byI = {};
    saved.forEach((f) => { byI[String(f.i)] = f; });
    return base.map((m) => {
      const s = byI[String(m.i)];
      if (!s) return m;
      return Object.assign({}, m, {
        clasif: s.clasif != null ? s.clasif : m.clasif,
        codigo: s.codigo != null ? s.codigo : m.codigo,
        origen: s.origen || m.origen,
        _eliminado: !!s.eliminado,
      });
    });
  } catch (e) { return base; }
}
function agregarOpcionClasif(nombre) {
  upsertClasif(nombre, "");
  document.querySelectorAll("select[data-k='clasif']").forEach((sel) => {
    if ([...sel.options].some((o) => o.value === nombre)) return;
    const opt = document.createElement("option");
    opt.value = nombre;
    opt.textContent = nombre;
    const otro = sel.querySelector('option[value="' + OTRO + '"]');
    if (otro) sel.insertBefore(opt, otro);
    else sel.appendChild(opt);
  });
}
function bindUno(el) {
  const aplicar = () => {
    const i = Number(el.getAttribute("data-i"));
    const k = el.getAttribute("data-k");
    const grupo = String(el.getAttribute("data-idxs") || i).split(",").map((x) => Number(x)).filter((n) => FILAS[n]);
    let dest = grupo.length ? grupo : [i];
    if (!FILAS[i]) return;
    if (k === "clasif") {
      if (el.value === OTRO) {
        FILAS[i]._editOtro = true;
        const td = el.closest("td");
        td.innerHTML = `<input type="text" placeholder="Nueva clasificación" data-i="${i}" data-idxs="${dest.join(",")}" data-k="clasif_nuevo"/>`;
        const inp = td.querySelector("input");
        bindUno(inp);
        inp.focus();
        return;
      }
      dest.forEach((j) => {
        FILAS[j].clasif = el.value;
        FILAS[j]._editOtro = false;
        FILAS[j].origen = "manual";
      });
      if (!clasifUsaCuenta(normClasif(el.value))) {
        dest.forEach((j) => pintarFilaCuenta(j, "99999", "a_clasificar"));
        persistLocal();
        return;
      }
      const cod = cuentaDeClasif(el.value);
      if (cod) {
        dest.forEach((j) => {
          FILAS[j].origen = "manual";
          pintarFilaCuenta(j, cod, "manual");
        });
        upsertClasif(el.value, cod);
        persistLocal();
      } else persistLocal();
      return;
    }
    if (k === "clasif_nuevo") {
      const nom = String(el.value || "").trim();
      FILAS[i]._editOtro = false;
      const td = el.closest("td");
      if (nom) {
        agregarOpcionClasif(nom);
        dest.forEach((j) => { FILAS[j].clasif = nom; FILAS[j].origen = "manual"; });
        const cod = cuentaDeClasif(nom);
        if (cod) dest.forEach((j) => pintarFilaCuenta(j, cod, "manual"));
      }
      td.innerHTML = `<select data-i="${i}" data-idxs="${dest.join(",")}" data-k="clasif">${optsClasif(FILAS[i].clasif)}</select>`;
      bindUno(td.querySelector("select"));
      persistLocal();
      return;
    }
    if (k === "codigo") {
      const codigoFinal = codigoDesdeTexto(el.value);
      const clasifRef = FILAS[i].clasif;
      const claveRef = claveSimilar(FILAS[i]);
      dest.forEach((j) => {
        FILAS[j].codigo = codigoFinal;
        FILAS[j].origen = codigoFinal === "99999" ? "a_clasificar" : "manual";
      });
      let huboOtros = false;
      if (clasifUsaCuenta(normClasif(clasifRef)) && codigoFinal !== "99999") {
        upsertClasif(clasifRef, codigoFinal);
        const otros = FILAS
          .map((f, idx) => idx)
          .filter((idx) => dest.indexOf(idx) < 0
            && String(FILAS[idx].codigo || "") !== codigoFinal
            && (normClasif(FILAS[idx].clasif) === normClasif(clasifRef)
                || (claveRef && claveSimilar(FILAS[idx]) === claveRef)));
        if (otros.length && window.confirm("¿Aplicar esta cuenta también a los otros " + otros.length + " movimientos parecidos (" + clasifRef + ")?")) {
          otros.forEach((j) => {
            FILAS[j].codigo = codigoFinal;
            FILAS[j].clasif = clasifRef;
            FILAS[j].origen = "manual";
          });
          dest = dest.concat(otros);
          huboOtros = true;
        }
      }
      if (huboOtros) {
        pintar();
      } else {
        dest.forEach((j) => pintarFilaCuenta(j, FILAS[j].codigo, FILAS[j].origen));
      }
      chips();
      persistLocal();
      return;
    }
    dest.forEach((j) => { FILAS[j][k] = el.value; });
    persistLocal();
  };
  el.addEventListener("change", aplicar);
  if (el.getAttribute("data-k") === "clasif_nuevo" || el.getAttribute("data-k") === "codigo") {
    el.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        el.blur();
        aplicar();
      }
    });
  }
}
function celdaClasif(m, i, idxsAttr) {
  if (m._editOtro) {
    return `<input type="text" placeholder="Nueva clasificación" value="" data-i="${i}" data-idxs="${idxsAttr}" data-k="clasif_nuevo"/>`;
  }
  return `<select data-i="${i}" data-idxs="${idxsAttr}" data-k="clasif">${optsClasif(m.clasif)}</select>`;
}
function esCobranza(m) {
  const t = (String(m.clasif || "") + " " + String(m.codigo || "")).toLowerCase();
  return t.indexOf("deudor") >= 0 || t.indexOf("transferencia recib") >= 0 || String(m.codigo || "").indexOf("113") === 0;
}
function dejarUnLado(m) {
  if (esCobranza(m)) m.deb = 0;
  else m.cred = 0;
  return m;
}
function gruposVista() {
  const seen = {};
  const out = [];
  FILAS.forEach((m, i) => {
    const deb = Number(m.deb || 0);
    const cred = Number(m.cred || 0);
    if (deb <= 0.004 && cred <= 0.004) return;
    const k = claveRepetida(m) || ("row-" + i);
    if (seen[k] != null) {
      const g = out[seen[k]];
      g.idxs.push(i);
      g.deb += deb;
      g.cred += cred;
      return;
    }
    seen[k] = out.length;
    out.push({ i: i, idxs: [i], m: m, deb: deb, cred: cred });
  });
  return out;
}
function pintar() {
  const tb = document.getElementById("grid");
  const wrap = document.querySelector(".wrap");
  const y = wrap ? wrap.scrollTop : 0;
  asegurarDatalistCuentas();
  const grupos = gruposVista();
  tb.innerHTML = grupos.map((g) => {
    const m = g.m;
    const i = g.i;
    const idxsAttr = g.idxs.join(",");
    const extra = g.idxs.length > 1 ? ` <span class="tag regla">×${g.idxs.length}</span>` : "";
    const elim = !!m._eliminado;
    let deb = Number(g.deb || 0);
    let cred = Number(g.cred || 0);
    if (deb > 0.004 && cred > 0.004) {
      if (esCobranza(m)) deb = 0;
      else cred = 0;
    }
    return `
    <tr class="${elim ? "elim" : (m.origen === "a_clasificar" ? "pend" : "")}">
      <td>${esc(m.fecha)}</td>
      <td>${esc(m.desc)}${extra}</td>
      <td class="num deb">${money(deb)}</td>
      <td class="num cred">${money(cred)}</td>
      <td>${celdaClasif(m, i, idxsAttr)}</td>
      <td><input list="dl-cuentas" data-i="${i}" data-idxs="${idxsAttr}" data-k="codigo" value="${esc(textoDeCodigo(m.codigo, m.opciones_codigo))}" placeholder="Buscar cuenta..." autocomplete="off"/></td>
      <td><span class="tag ${esc(m.origen)}">${labelOrigen(m.origen)}</span></td>
      <td><button type="button" class="btn-del" data-idxs="${idxsAttr}" data-accion="${elim ? "restaurar" : "eliminar"}" title="${elim ? "Restaurar movimiento" : "Eliminar: no es parte del extracto"}">${elim ? "\u21ba" : "\ud83d\uddd1"}</button></td>
    </tr>`;
  }).join("");
  tb.querySelectorAll("input, select").forEach(bindUno);
  tb.querySelectorAll(".btn-del").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idxs = String(btn.getAttribute("data-idxs") || "")
        .split(",").map((x) => Number(x)).filter((n) => FILAS[n]);
      const nuevo = btn.getAttribute("data-accion") === "eliminar";
      idxs.forEach((j) => { FILAS[j]._eliminado = nuevo; });
      persistLocal();
      pintar();
    });
  });
  chips();
  setHeight();
  if (wrap) wrap.scrollTop = y;
}
function chips() {
  const activas = FILAS.filter((m) => !m._eliminado);
  const nR = activas.filter((m) => m.origen === "regla").length;
  const nS = activas.filter((m) => m.origen === "sugerido").length;
  const nP = activas.filter((m) => m.origen === "a_clasificar").length;
  document.getElementById("n-regla").textContent = nR + " con regla";
  document.getElementById("n-sug").textContent = nS + " sugeridas";
  document.getElementById("n-pend").textContent = nP + " a clasificar";
}

function sigCuentas(lista) {
  return (lista || []).map((c) => String(c.codigo || "") + ":" + String(c.label || "")).join("|");
}
function onRender(event) {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  document.getElementById("titulo").textContent = args.titulo || "Extracto";
  document.getElementById("sub").textContent = args.subtitulo || "";
  GRID_ID = String(args.grid_id || args.titulo || "extracto");
  const fromJson = parseCuentas(args.cuentas_json);
  const fromList = parseCuentas(args.cuentas);
  const nuevas = (fromList.length >= fromJson.length) ? fromList : fromJson;
  const sig = sigCuentas(nuevas);
  const cuentasCambiaron = sig !== CUENTAS_SIG;
  CUENTAS = nuevas;
  CUENTAS_SIG = sig;
  const nuevasClas = parseLista(args.clasifs_json || args.clasifs);
  if (nuevasClas.length) {
    nuevasClas.forEach((c) => {
      const nom = String(c.nombre || "").trim();
      const i = CLASIFS.findIndex((x) => normClasif(x.nombre) === normClasif(nom));
      if (i >= 0 && CLASIFS[i].codigo && CLASIFS[i].codigo !== "99999") return;
      upsertClasif(c.nombre, c.codigo);
    });
  }
  const base = sinRecap((args.filas || []).map((m) => dejarUnLado(Object.assign({}, m))));
  const sigFilas = firmaFilas(base);
  if (!PINTADO || sigFilas !== FILAS_SIG) {
    FILAS = restoreLocal(base);
    FILAS_SIG = sigFilas;
    PINTADO = true;
    pintar();
  } else if (cuentasCambiaron) {
    pintar();
  } else {
    setHeight();
  }
}

document.getElementById("btn-sig").addEventListener("click", () => {
  sendValue(Object.assign({ action: "siguiente" }, snapshot()));
});
document.getElementById("btn-vol").addEventListener("click", () => {
  sendValue(Object.assign({ action: "volver" }, snapshot()));
});
window.addEventListener("message", onRender);
send("streamlit:componentReady", { apiVersion: 1 });
setHeight();
</script>
</body>
