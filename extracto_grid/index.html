<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --navy: #1F4E79;
    --navy-2: #163a5c;
    --ink: #1a2332;
    --muted: #5c6379;
    --line: #e6eaf0;
    --green: #137333;
    --green-bg: #e6f4ea;
    --amber: #b06000;
    --amber-bg: #fff4e5;
    --red: #c5221f;
    --red-bg: #fce8e6;
    --zebra: #f7f9fc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: Inter, "Segoe UI", Calibri, system-ui, sans-serif;
    color: var(--ink); background: transparent;
    -webkit-font-smoothing: antialiased;
  }
  .ce-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 0 0 16px; }
  .ce-title { font-size: 1.35rem; font-weight: 700; color: var(--navy); margin: 0; letter-spacing: -0.02em; }
  .ce-sub { color: var(--muted); font-size: .9rem; margin: 4px 0 0; line-height: 1.45; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; margin: 10px 6px 0 0; }
  .chip.regla { background: var(--green-bg); color: var(--green); }
  .chip.sugerido { background: var(--amber-bg); color: var(--amber); }
  .chip.a_clasificar { background: var(--red-bg); color: var(--red); }
  .btn { border: 0; border-radius: 16px; padding: 10px 16px; font-weight: 650; cursor: pointer; font-size: 14px; transition: background .2s ease, box-shadow .2s ease, transform .2s ease; }
  .btn.primary { background: var(--navy); color: #fff; min-width: 128px; }
  .btn.primary:hover { background: var(--navy-2); box-shadow: 0 8px 18px rgba(31, 78, 121, 0.22); transform: translateY(-1px); }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  .wrap { max-height: 640px; overflow: auto; border: 1px solid var(--line); border-radius: 22px; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 28px rgba(15,23,42,.06); }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--navy); color: #fff; font-size: 12px; font-weight: 600;
    text-align: left; padding: 12px; white-space: nowrap;
  }
  thead th.num { text-align: right; }
  tbody td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:nth-child(even) { background: var(--zebra); }
  tbody tr.pend { background: #fff6f5; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .deb { color: #9b1c1c; }
  .cred { color: #137333; }
  select, input[type="text"] {
    width: 100%; min-width: 140px; border: 1px solid #d3dae4; border-radius: 12px;
    padding: 7px 9px; font-size: 12.5px; background: #fff; font-family: inherit;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  select:focus, input[type="text"]:focus {
    outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.14);
  }
  .tag { font-size: 11px; font-weight: 650; padding: 3px 8px; border-radius: 999px; }
  .tag.regla { background: var(--green-bg); color: var(--green); }
  .tag.sugerido { background: var(--amber-bg); color: var(--amber); }
  .tag.a_clasificar { background: var(--red-bg); color: var(--red); }
  .foot { margin-top: 14px; }
</style>
</head>
<body>
  <div class="ce-top">
    <div>
      <p class="ce-title" id="titulo">Extracto</p>
      <p class="ce-sub" id="sub"></p>
      <span class="chip regla" id="n-regla">0 con regla</span>
      <span class="chip sugerido" id="n-sug">0 sugeridas</span>
      <span class="chip a_clasificar" id="n-pend">0 a clasificar</span>
    </div>
    <button class="btn primary" type="button" id="btn-sig">Siguiente</button>
  </div>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Descripción</th>
          <th class="num">Débito</th>
          <th class="num">Crédito</th>
          <th>Clasificación</th>
          <th>Cuenta Tango</th>
          <th>Origen</th>
        </tr>
      </thead>
      <tbody id="grid"></tbody>
    </table>
  </div>
  <div class="foot">
    <button class="btn ghost" type="button" id="btn-vol">Volver a subir</button>
  </div>
<script>
function send(type, data) {
  const msg = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
  window.parent.postMessage(msg, "*");
}
function setHeight() {
  const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, 420);
  send("streamlit:setFrameHeight", { height: h + 8 });
}
function sendValue(value) {
  send("streamlit:setComponentValue", { value: value, dataType: "json" });
}

let FILAS = [];
let CUENTAS = [];
let CLASIFS = [];
let PINTADO = false;
const OTRO = "__otro__";

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function money(n) {
  const x = Number(n || 0);
  if (!x) return "";
  return x.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function parseLista(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  if (typeof raw === "string") {
    try { return JSON.parse(raw); } catch (e) { return []; }
  }
  return [];
}
function parseCuentas(raw) { return parseLista(raw); }
function normClasif(s) {
  return String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
}
function claveRepetida(m) {
  let t = String(m.desc || "").toLowerCase().trim();
  t = t.replace(/\s+/g, " ").replace(/\b\d{5,}\b/g, "").trim();
  return t;
}
function cuentaDeClasif(nombre) {
  const n = normClasif(nombre);
  if (!n || n === "sin clasificar" || n.indexOf("identificar") >= 0) return "";
  const hit = CLASIFS.find((c) => normClasif(c.nombre) === n);
  const cod = hit ? String(hit.codigo || "") : "";
  return (cod && cod !== "99999") ? cod : "";
}
function upsertClasif(nombre, codigo) {
  const nom = String(nombre || "").trim();
  if (!nom) return;
  const i = CLASIFS.findIndex((c) => normClasif(c.nombre) === normClasif(nom));
  const cod = String(codigo || "");
  if (i >= 0) {
    if (cod && cod !== "99999") CLASIFS[i].codigo = cod;
    return;
  }
  CLASIFS.push({ nombre: nom, codigo: (cod && cod !== "99999") ? cod : "" });
}
function optsHtml(sel) {
  return CUENTAS.map((c) => {
    const cod = String(c.codigo || "");
    const lab = c.label || (cod + " — ");
    return `<option value="${esc(cod)}" ${cod === String(sel) ? "selected" : ""}>${esc(lab)}</option>`;
  }).join("");
}
function optsClasif(sel) {
  const seen = {};
  let html = "";
  CLASIFS.forEach((c) => {
    const n = String(c.nombre || "").trim();
    const k = normClasif(n);
    if (!n || seen[k]) return;
    seen[k] = true;
    html += `<option value="${esc(n)}" ${normClasif(n) === normClasif(sel) ? "selected" : ""}>${esc(n)}</option>`;
  });
  if (sel && !seen[normClasif(sel)]) {
    html = `<option value="${esc(sel)}" selected>${esc(sel)}</option>` + html;
  }
  html += `<option value="${OTRO}">Otro…</option>`;
  return html;
}
function labelOrigen(o) {
  if (o === "regla") return "Regla";
  if (o === "sugerido") return "Sugerido";
  return "A clasificar";
}
function snapshot() {
  return {
    filas: FILAS.map((m) => ({
      i: m.i,
      clasif: m.clasif,
      codigo: m.codigo,
      origen: m.origen,
    })),
    clasifs: CLASIFS.map((c) => ({ nombre: c.nombre, codigo: c.codigo || "" })),
  };
}
function aplicarClasifAFila(i, nombre) {
  const nom = String(nombre || "").trim();
  FILAS[i].clasif = nom;
  FILAS[i]._editOtro = false;
  const cod = cuentaDeClasif(nom);
  if (cod) {
    FILAS[i].codigo = cod;
    FILAS[i].origen = "sugerido";
  }
  const clave = claveRepetida(FILAS[i]);
  FILAS.forEach((m, j) => {
    if (j === i) return;
    if (clave && claveRepetida(m) === clave) {
      m.clasif = nom;
      if (cod) {
        m.codigo = cod;
        if (m.origen === "a_clasificar") m.origen = "sugerido";
      }
    } else if (cod && normClasif(m.clasif) === normClasif(nom)) {
      m.codigo = cod;
      if (m.origen === "a_clasificar") m.origen = "sugerido";
    }
  });
}
function celdaClasif(m, i) {
  if (m._editOtro) {
    return `<input type="text" placeholder="Nueva clasificación" value="" data-i="${i}" data-k="clasif_nuevo"/>`;
  }
  return `<select data-i="${i}" data-k="clasif">${optsClasif(m.clasif)}</select>`;
}
function pintar() {
  const tb = document.getElementById("grid");
  tb.innerHTML = FILAS.map((m, i) => `
    <tr class="${m.origen === "a_clasificar" ? "pend" : ""}">
      <td>${esc(m.fecha)}</td>
      <td>${esc(m.desc)}</td>
      <td class="num deb">${money(m.deb)}</td>
      <td class="num cred">${money(m.cred)}</td>
      <td>${celdaClasif(m, i)}</td>
      <td><select data-i="${i}" data-k="codigo">${optsHtml(m.codigo)}</select></td>
      <td><span class="tag ${esc(m.origen)}">${labelOrigen(m.origen)}</span></td>
    </tr>`).join("");
  tb.querySelectorAll("input, select").forEach((el) => {
    const aplicar = () => {
      const i = Number(el.getAttribute("data-i"));
      const k = el.getAttribute("data-k");
      if (k === "clasif") {
        if (el.value === OTRO) {
          FILAS[i]._editOtro = true;
          pintar();
          const inp = tb.querySelector(`input[data-k="clasif_nuevo"][data-i="${i}"]`);
          if (inp) inp.focus();
          return;
        }
        upsertClasif(el.value, cuentaDeClasif(el.value) || FILAS[i].codigo);
        aplicarClasifAFila(i, el.value);
        pintar();
        return;
      }
      if (k === "clasif_nuevo") {
        const nom = String(el.value || "").trim();
        FILAS[i]._editOtro = false;
        if (nom) {
          upsertClasif(nom, FILAS[i].codigo);
          aplicarClasifAFila(i, nom);
        }
        pintar();
        return;
      }
      if (k === "codigo") {
        FILAS[i].codigo = el.value;
        FILAS[i].origen = el.value === "99999" ? "a_clasificar" : (FILAS[i].origen === "regla" ? "regla" : "sugerido");
        if (FILAS[i].clasif) upsertClasif(FILAS[i].clasif, el.value);
        const clave = claveRepetida(FILAS[i]);
        const clas = normClasif(FILAS[i].clasif);
        FILAS.forEach((m) => {
          const mismaClas = clas && normClasif(m.clasif) === clas;
          const mismaDesc = clave && claveRepetida(m) === clave;
          if (mismaClas || mismaDesc) {
            m.codigo = el.value;
            m.origen = el.value === "99999" ? "a_clasificar" : (m.origen === "regla" ? "regla" : "sugerido");
          }
        });
        pintar();
        return;
      }
      FILAS[i][k] = el.value;
      chips();
    };
    el.addEventListener("change", aplicar);
    if (el.getAttribute("data-k") === "clasif_nuevo") {
      el.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          aplicar();
        }
      });
    }
  });
  chips();
  setHeight();
}
function chips() {
  const nR = FILAS.filter((m) => m.origen === "regla").length;
  const nS = FILAS.filter((m) => m.origen === "sugerido").length;
  const nP = FILAS.filter((m) => m.origen === "a_clasificar").length;
  document.getElementById("n-regla").textContent = nR + " con regla";
  document.getElementById("n-sug").textContent = nS + " sugeridas";
  document.getElementById("n-pend").textContent = nP + " a clasificar";
}

function onRender(event) {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  document.getElementById("titulo").textContent = args.titulo || "Extracto";
  document.getElementById("sub").textContent = args.subtitulo || "";
  const nuevas = parseCuentas(args.cuentas_json || args.cuentas);
  const hayCuentasNuevas = nuevas.length !== CUENTAS.length;
  CUENTAS = nuevas;
  const nuevasClas = parseLista(args.clasifs_json || args.clasifs);
  if (nuevasClas.length) {
    nuevasClas.forEach((c) => upsertClasif(c.nombre, c.codigo));
  }
  if (!PINTADO) {
    FILAS = (args.filas || []).map((m) => Object.assign({}, m));
    PINTADO = true;
    pintar();
  } else if (hayCuentasNuevas && nuevas.length) {
    pintar();
  } else {
    setHeight();
  }
}

document.getElementById("btn-sig").addEventListener("click", () => {
  sendValue(Object.assign({ action: "siguiente" }, snapshot()));
});
document.getElementById("btn-vol").addEventListener("click", () => {
  sendValue(Object.assign({ action: "volver" }, snapshot()));
});
window.addEventListener("message", onRender);
send("streamlit:componentReady", { apiVersion: 1 });
setHeight();
</script>
</body>
</html>
