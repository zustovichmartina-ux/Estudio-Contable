[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Oculta Deploy/Desplegar del chrome nativo
toolbarMode = "minimal"
showSidebarNavigation = false
